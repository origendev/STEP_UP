<!-- ============================================================
     round1.html — Round 1 Assessment
============================================================ -->

<div class="view" id="view-round1">

  <div class="section-heading" style="margin-top:36px;">
    <div>
      <h2>Round 1 Assessment</h2>
<p>ORIGEN Assessment</p>
    </div>
  </div>

  <section class="round1-assessment">

    <div class="round1-topbar">
      <div>
        <strong>Question <span id="round1Current">1</span> of 50</strong>
      </div>

      <div class="round1-timer">
        Time Left:
        <strong id="round1Timer">60:00</strong>
      </div>
    </div>


    <div class="card round1-question-card">

      <div class="round1-question-number">
        Question <span id="round1QuestionNumber">1</span>
      </div>

      <h3 id="round1Question">
        Loading question...
      </h3>

      <div id="round1Options" class="round1-options"></div>

    </div>


    <div class="round1-controls">

  <div class="round1-navigation">

    <button
      class="progress-round-button round1-secondary"
      id="round1Previous">
      Previous
    </button>

    <button
      class="progress-round-button"
      id="round1Next">
      Next
      <span>›</span>
    </button>

  </div>

  <button
    class="progress-round-button round1-submit"
    id="round1Submit">
    Submit Assessment
  </button>

</div>

  </section>

</div>
