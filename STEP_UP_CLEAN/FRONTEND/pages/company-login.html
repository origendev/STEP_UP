<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StepUp — Company Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    .company-login-page{min-height:100vh;display:grid;place-items:center;padding:32px;}
    .company-login-wrap{width:min(440px,100%);}
    .company-login-brand{text-align:center;margin-bottom:22px;}
    .company-login-brand .brand{font-size:30px;}
    .company-login-brand p{margin:7px 0 0;color:var(--ink-soft);font-size:13px;}
    .company-login-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-card);}
    .company-login-card .eyebrow{margin:0 0 8px;color:var(--violet-600);font-size:11px;font-weight:800;letter-spacing:.12em;}
    .company-login-card h1{margin:0;font-size:28px;}
    .company-login-card .description{color:var(--ink-soft);line-height:1.6;font-size:14px;margin:10px 0 24px;}
    .company-login-card label{display:block;margin:0 0 16px;font-size:13px;font-weight:700;}
    .company-login-card input{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--lilac-bg);color:var(--ink);outline:none;}
    .company-login-card input:focus{border-color:var(--violet-500);box-shadow:0 0 0 3px var(--violet-100);}
    .company-login-button{width:100%;border:0;border-radius:10px;padding:12px 14px;background:var(--violet-700);color:#fff;font-weight:700;}
    .company-login-button:hover{background:var(--violet-600);}
    .company-login-divider{height:1px;background:var(--line);margin:24px 0;}
    .company-login-secondary{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--white);color:var(--ink);font-weight:700;}
    .company-back{display:block;text-align:center;margin-top:18px;color:var(--violet-700);font-size:13px;font-weight:700;}
  </style>
</head>
<body class="company-login-page">
  <main class="company-login-wrap">
    <div class="company-login-brand">
      <div class="brand"><span class="brand-mark">S</span>StepUp</div>
      <p>Company Portal</p>
    </div>
    <section class="company-login-card">
      <p class="eyebrow">COMPANY PORTAL</p>
      <h1>Welcome back</h1>
      <p class="description">Sign in to manage your company profile and publish opportunities directly into StepUp Jobs.</p>
      <form id="companyLoginForm">
        <label>Work email<input id="companyEmail" type="email" placeholder="recruiter@company.com" required></label>
        <label>Password<input type="password" placeholder="Enter your password" required></label>
        <button type="submit" class="company-login-button">Sign In</button>
      </form>
      <div class="company-login-divider"></div>
      <button class="company-login-secondary" type="button" id="createCompanyButton">Create Company Account</button>
      <a class="company-back" href="../index.html#/jobs">← Back to Jobs</a>
    </section>
  </main>
  <script>
    document.getElementById('companyLoginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const email=document.getElementById('companyEmail').value.trim();
      if(email) localStorage.setItem('stepupCompanyEmail', email);
      alert('Company login UI is connected. Authentication can be wired to the backend next.');
    });
    document.getElementById('createCompanyButton').addEventListener('click', function(){
      alert('Company registration can be connected to the existing /api/companies endpoint.');
    });
  </script>
</body>
</html>
