<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>StepUp — Reset Password</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/student-auth.css">
</head>

<body class="student-auth-page">

<main class="student-auth-wrap">

  <div class="student-auth-brand">
    <img class="student-auth-logo" src="assets/logo.png" alt="StepUp">
  </div>

  <section class="student-auth-card">

    <p class="eyebrow">PASSWORD RESET</p>

    <h1>Reset your password</h1>

    <p class="description">
      Enter your registration number to receive a one-time password (OTP)
      on your registered institutional email.
    </p>

    <div id="message" class="student-auth-message"></div>

    <!-- REQUEST OTP -->
    <form id="requestForm">

      <label>
        Registration Number
        <input
          id="regNo"
          type="text"
          autocomplete="username"
          placeholder="Enter your registration number"
          required
        >
      </label>

      <button
        class="student-auth-button"
        type="submit"
        id="sendBtn"
      >
        Send OTP
      </button>

    </form>

    <!-- RESET PASSWORD -->
    <form
      id="resetForm"
      style="display:none;margin-top:20px;"
    >

      <label>
        OTP
        <input
          id="otp"
          type="text"
          inputmode="numeric"
          maxlength="6"
          placeholder="Enter 6-digit OTP"
          required
        >
      </label>

      <label>
        New Password
        <input
          id="newPassword"
          type="password"
          minlength="8"
          placeholder="At least 8 characters"
          required
        >
      </label>

      <label>
        Confirm New Password
        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          placeholder="Re-enter your password"
          required
        >
      </label>

      <button
        class="student-auth-button"
        type="submit"
      >
        Reset Password
      </button>

    </form>

    <div class="student-auth-divider"></div>

    <a
      class="student-auth-link"
      style="text-align:center;margin:0;"
      href="student-login.html"
    >
      ← Back to student login
    </a>

  </section>

</main>

<script type="module">

import { api } from './js/core/api.js';

const requestForm = document.getElementById('requestForm');
const resetForm = document.getElementById('resetForm');

const regNoInput = document.getElementById('regNo');
const otpInput = document.getElementById('otp');

const newPasswordInput =
  document.getElementById('newPassword');

const confirmPasswordInput =
  document.getElementById('confirmPassword');

const sendBtn =
  document.getElementById('sendBtn');

const message =
  document.getElementById('message');


function showMessage(text, type = 'error') {

  message.textContent = text;

  message.className =
    `student-auth-message show ${type}`;

}


/* =========================
   REQUEST OTP
========================= */

requestForm.addEventListener('submit', async (e) => {

  e.preventDefault();

  const regNo = regNoInput.value.trim();

  if (!regNo) {

    showMessage(
      'Registration number is required.'
    );

    return;
  }

  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending OTP…';

  try {

    const result = await api(
      '/student/forgot-password/request',
      {
        method: 'POST',

        body: JSON.stringify({
          regNo: regNo
        })
      }
    );

    showMessage(
      result.data?.message ||
      'If the registration number belongs to a StepUp student account, an OTP has been sent to the registered email.',
      'success'
    );

    resetForm.style.display = 'block';

  } catch (err) {

    showMessage(
      err.message ||
      'Could not send OTP.'
    );

  } finally {

    sendBtn.disabled = false;
    sendBtn.textContent = 'Send OTP';

  }

});


/* =========================
   RESET PASSWORD
========================= */

resetForm.addEventListener('submit', async (e) => {

  e.preventDefault();

  const regNo =
    regNoInput.value.trim();

  const otp =
    otpInput.value.trim();

  const newPassword =
    newPasswordInput.value;

  const confirmPassword =
    confirmPasswordInput.value;


  if (!regNo) {

    showMessage(
      'Registration number is required.'
    );

    return;
  }


  if (!otp) {

    showMessage(
      'OTP is required.'
    );

    return;
  }


  if (newPassword.length < 8) {

    showMessage(
      'New password must be at least 8 characters.'
    );

    return;
  }


  if (newPassword !== confirmPassword) {

    showMessage(
      'Passwords do not match.'
    );

    return;
  }


  try {

    const result = await api(
      '/student/forgot-password/reset',
      {
        method: 'POST',

        body: JSON.stringify({

          regNo: regNo,

          otp: otp,

          newPassword: newPassword

        })
      }
    );


    showMessage(
      result.data?.message ||
      'Password reset successfully. You can now sign in.',
      'success'
    );


    setTimeout(() => {

      window.location.href =
        'student-login.html';

    }, 1500);


  } catch (err) {

    showMessage(
      err.message ||
      'Could not reset the password.'
    );

  }

});

</script>

</body>
</html>
