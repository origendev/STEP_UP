<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="StepUp admin login"><title>StepUp — Admin Login</title><style>
:root{--bg:#eef2ff;--line:rgba(255,255,255,.9);--text:#1b1a45;--muted:#566082;--violet:#7257ff;--blue:#4c70ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;background:url('../assets/home-bg.jpg') center right/cover no-repeat,var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.login-wrap{width:min(430px,100%)}.brand{text-align:center;margin-bottom:22px}.brand img{height:64px;width:auto;display:inline-block}.card{padding:28px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.74),rgba(255,255,255,.52));-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);box-shadow:0 18px 50px rgba(88,76,200,.18),inset 0 1px 0 rgba(255,255,255,.9)}.eyebrow{margin:0 0 8px;color:#5f36e8;font-size:11px;font-weight:800;letter-spacing:.12em}h1{margin:0;font-size:25px}.description{margin:9px 0 24px;color:var(--muted);font-size:13px;line-height:1.55}label{display:block;margin-bottom:14px;font-size:12px;font-weight:700}input{width:100%;margin-top:7px;padding:11px 12px;border:1px solid #d9d3f5;border-radius:9px;background:rgba(255,255,255,.9);color:var(--text);outline:0;font:inherit;font-size:13px}input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(114,87,255,.22)}button{width:100%;min-height:42px;margin-top:5px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.notice{margin:16px 0 0;padding:10px 12px;border:1px solid rgba(114,87,255,.22);border-radius:9px;color:var(--muted);background:rgba(255,255,255,.6);font-size:11.5px;line-height:1.5;text-align:center}.back{display:block;margin-top:12px;color:#4c2fc4;text-align:center;font-size:12px;text-decoration:none}.back:hover{text-decoration:underline}.error{display:none;margin:0 0 15px;padding:10px 12px;border:1px solid #f3c1d0;border-radius:9px;background:#fdeaf0;color:#c2335c;font-size:12px}.error.show{display:block}.busy{opacity:.65;pointer-events:none}
</style></head><body><main class="login-wrap"><div class="brand"><img src="../assets/logo.png" alt="StepUp"></div><section class="card"><p class="eyebrow">ADMIN PORTAL</p><h1>Admin Sign In</h1><p class="description">Sign in to manage StepUp students, companies, jobs and recruitment activity.</p><p id="error" class="error"></p><form id="adminLoginForm" novalidate><label for="adminId">Admin ID<input id="adminId" name="adminId" type="text" placeholder="Enter admin ID" autocomplete="username" required></label><label for="adminPassword">Password<input id="adminPassword" name="adminPassword" type="password" placeholder="Enter admin password" autocomplete="current-password" required></label><button id="submitBtn" type="submit">Sign In</button></form><p class="notice">Admin access is restricted to the single configured StepUp administrator.</p><a class="back" href="../portal-access.html">&larr; Back to portal selection</a></section></main><script src="../js/config.js"></script><script>
const API_BASE=window.STEPUP_API_BASE_URL||'http://localhost:3000/api';const form=document.getElementById('adminLoginForm'),error=document.getElementById('error'),btn=document.getElementById('submitBtn');
function showError(msg){error.textContent=msg;error.classList.add('show')}form.addEventListener('submit',async e=>{e.preventDefault();error.classList.remove('show');const adminId=document.getElementById('adminId').value.trim(),password=document.getElementById('adminPassword').value;if(!adminId||!password){showError('Enter the Admin ID and password.');return}btn.textContent='Signing in...';form.classList.add('busy');try{const r=await fetch(API_BASE+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({adminId,password})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Admin login failed.');sessionStorage.setItem('stepupAdminToken',data.data.token);sessionStorage.setItem('stepupAdmin',JSON.stringify(data.data.admin));window.location.href='admin-dashboard.html'}catch(err){showError(err.message||'Unable to connect to the StepUp server. Make sure the backend is running.')}finally{btn.textContent='Sign In';form.classList.remove('busy')}});
</script></body></html>
