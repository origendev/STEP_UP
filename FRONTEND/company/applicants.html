<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StepUp — Applicants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<style>
body{min-height:100vh}.portal-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 32px;background:var(--white);border-bottom:1px solid var(--line)}.portal-actions{display:flex;gap:9px}.portal-btn{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:9px;padding:9px 12px;font-weight:700;font-size:12px}.portal-btn.primary{border:0;background:var(--violet-600);color:#fff}.portal-main{max-width:1180px;margin:0 auto;padding:34px 32px 70px}.portal-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}.portal-head h1{margin:0;font-size:28px}.portal-head p{margin:7px 0 0;color:var(--ink-soft);font-size:13px}.company-chip{padding:9px 12px;border-radius:10px;background:var(--violet-100);color:var(--violet-700);font-size:12px;font-weight:800}.message{display:none;margin-bottom:14px;padding:10px 12px;border-radius:9px;font-size:12px}.message.error{display:block;background:var(--rose-bg);color:var(--rose)}.message.ok{display:block;background:var(--green-bg);color:var(--green)}.applicant-list{display:flex;flex-direction:column;gap:14px}.applicant-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow-card)}.applicant-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.student-id{display:flex;gap:12px;align-items:center}.student-avatar{width:48px;height:48px;border-radius:12px;background:var(--violet-100);color:var(--violet-700);display:grid;place-items:center;font-weight:800}.student-id h2{margin:0;font-size:17px}.student-id p{margin:4px 0 0;color:var(--ink-soft);font-size:11.5px}.status{padding:6px 10px;border-radius:999px;font-size:10.5px;font-weight:800}.status.applied{background:var(--violet-100);color:var(--violet-700)}.status.selected{background:var(--green-bg);color:var(--green)}.status.rejected{background:var(--rose-bg);color:var(--rose)}.status.waitlisted{background:#fff3d6;color:#a86b00}.student-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.student-field{padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--lilac-bg);min-width:0}.student-field small{display:block;color:var(--ink-soft);font-size:9.5px}.student-field strong{display:block;margin-top:3px;font-size:11.5px;overflow-wrap:anywhere}.resume-box{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}.resume-name{font-size:12px;font-weight:800}.resume-meta{margin-top:3px;color:var(--ink-soft);font-size:10.5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.action{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--white);color:var(--ink);font-size:11.5px;font-weight:800}.action.select{background:var(--green-bg);color:var(--green);border-color:#bfe9d3}.action.waitlist{background:var(--white);color:#a86b00;border-color:#e5d2a3}.action.reject{background:var(--rose-bg);color:var(--rose);border-color:#f0c5d2}.empty{padding:55px 20px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:12px;font-size:12.5px}@media(max-width:800px){.portal-head{align-items:flex-start;flex-direction:column}.student-grid{grid-template-columns:1fr 1fr}.portal-top{padding:12px 16px}.portal-main{padding:25px 16px 50px}}@media(max-width:520px){.student-grid{grid-template-columns:1fr}.applicant-top{flex-direction:column}}

.profile-full{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.profile-section{border:1px solid var(--line);border-radius:10px;background:var(--lilac-bg);padding:12px;margin-top:9px}
.profile-section h3{margin:0 0 9px;font-size:12.5px}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px}.profile-row{display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:10.5px;line-height:1.45}.profile-row span{color:var(--ink-soft)}.profile-row strong{overflow-wrap:anywhere}.profile-sub{margin:8px 0 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--white);font-size:10.5px}.profile-list{margin:0;padding-left:18px;font-size:10.5px}.profile-photo{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);float:right}.resume-box button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:800px){.profile-grid{grid-template-columns:1fr}.profile-row{grid-template-columns:120px 1fr}}
</style>
<script src="../js/config.js"></script>
</head>
<body>
<header class="portal-top">
  <div class="brand"><span class="brand-mark">S</span>StepUp <span style="font-family:Inter;font-size:11px;color:var(--ink-soft);font-weight:600">Company Portal</span></div>
  <div class="portal-actions"><a class="portal-btn" href="dashboard.html">Back to Dashboard</a><button class="portal-btn" id="logout">Sign Out</button></div>
</header>
<main class="portal-main">
  <div class="portal-head">
    <div><h1 id="jobTitle">Applicants</h1><p id="jobSub">Students who applied to this job</p></div>
    <div class="company-chip" id="companyName">Company</div>
  </div>
  <div id="message" class="message"></div>
  <section id="applicantList" class="applicant-list"><div class="empty">Loading applicants…</div></section>
</main>
<script>
const API=window.STEPUP_API_BASE_URL||'http://localhost:3000/api';
const token=localStorage.getItem('stepupCompanyToken');
if(!token) location.replace('company-login.html');
const params=new URLSearchParams(location.search);
const jobId=params.get('job');
const $=id=>document.getElementById(id);
let applicants=[];

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(n){return String(n||'S').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'S';}
function msg(text,type='error'){const m=$('message');m.textContent=text;m.className='message '+type;}
async function api(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opts.headers||{})}});
  if(r.status===401){localStorage.removeItem('stepupCompanyToken');localStorage.removeItem('stepupCompany');location.replace('company-login.html');throw Error('Session expired.');}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.error||'Request failed');
  return d.data;
}
function statusClass(s){return String(s).toLowerCase();}
function value(v){return v===null||v===undefined||v===''?'-':v;}
function fmt(v){
  if(v===null||v===undefined||v==='') return '-';
  if(Array.isArray(v)) return v.map(x=>typeof x==='object'?Object.entries(x).map(([k,val])=>`${k}: ${value(val)}`).join(' • '):String(x)).join(', ');
  if(typeof v==='object') return Object.entries(v).map(([k,val])=>`${k}: ${value(val)}`).join(' • ');
  return String(v);
}
function profileRows(obj, labels={}){
  if(!obj || typeof obj!=='object') return '';
  return Object.entries(obj).filter(([k,v])=>k!=='photo' && v!=='' && v!==null && v!==undefined && !(Array.isArray(v)&&!v.length)).map(([k,v])=>`<div class="profile-row"><span>${esc(labels[k]||k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()))}</span><strong>${esc(fmt(v))}</strong></div>`).join('');
}
function profileSection(title, body){return body?`<section class="profile-section"><h3>${esc(title)}</h3><div class="profile-grid">${body}</div></section>`:'';}
function renderCollection(title, arr){
  if(!Array.isArray(arr)||!arr.length) return '';
  return `<section class="profile-section"><h3>${esc(title)}</h3>${arr.map((item,i)=>`<div class="profile-sub"><b>${esc(item.title||item.name||item.level||`${title} ${i+1}`)}</b><div>${esc(fmt(item))}</div></div>`).join('')}</section>`;
}
function fullProfile(a){
  const pd=a.profile_details&&typeof a.profile_details==='object'?a.profile_details:{};
  const d=pd.details&&typeof pd.details==='object'?pd.details:{};
  const labels={name:'Full Name',first:'First Name',last:'Last Name',regNo:'Roll Number',branch:'Branch',course:'Course',college:'College',passOut:'Passed Out Year',cycle:'Placement Cycle',status:'Student Status',career:'Career Path',gender:'Gender',dob:'Birthday',pwd:'Person With Disability',da:'Differently Abled Person',acAtt:'Academics Attendance',tpAtt:'T&P Attendance',rfid:'RFID',mentor:'Mentor',advisor:'Advisor',coord:'Coordinator',admit:'Admission Through',rank:'Rank',religion:'Religion',category:'Category',regOn:'Registered On',verOn:'Verified On',registered:'Registered',verBy:'Verified By',dayScholar:'Day Scholar',nation:'Nationality',aadhaar:'Aadhaar Number',dl:'Driving Licence',passNo:'Passport Number',passIssue:'Passport Issue Date',passExp:'Passport Expiry',email:'Communication Email',phone:'Phone Number',pemail:'Personal Email',phone2:'Alt. Phone Number',wa:'WhatsApp Number',email2:'Alternative Email',pwa:'Parent / Guardian WhatsApp',iemail:'Institute Email',linkedin:'LinkedIn Profile',cCity:'Current City',cDist:'Current District',cState:'Current State',cCountry:'Current Country',cPin:'Current Pin Code',cAddr:'Current Address',pCity:'Permanent City',pDist:'Permanent District',pState:'Permanent State',pCountry:'Permanent Country',pPin:'Permanent Pin Code',pAddr:'Permanent Address',fName:"Father's Name",fEmail:"Father's Email",fPhone:"Father's Contact",fJob:"Father's Occupation",fCo:"Father's Company",fOff:"Father's Office Address",mName:"Mother's Name",mEmail:"Mother's Email",mPhone:"Mother's Contact",mJob:"Mother's Occupation",mCo:"Mother's Company",mOff:"Mother's Office Address"};
  function section(title,obj){const body=profileRows(obj,labels);return body?`<section class="profile-section"><h3>${esc(title)}</h3><div class="profile-grid">${body}</div></section>`:'';}
  function collection(title,list){if(!Array.isArray(list)||!list.length)return '';return `<section class="profile-section"><h3>${esc(title)}</h3>${list.map((x,i)=>`<div class="profile-sub"><b>${esc(x.title||x.name||x.level||`${title} ${i+1}`)}</b><div>${esc(fmt(x))}</div></div>`).join('')}</section>`;}
  const more=pd.more&&typeof pd.more==='object'?pd.more:{};
  const social=pd.social&&typeof pd.social==='object'?pd.social:{};
  const langs=pd.languages&&typeof pd.languages==='object'?pd.languages:{};
  const academics=Array.isArray(pd.academics)?pd.academics:[];
  const links=Array.isArray(pd.links)?pd.links:[];
  const tags=Array.isArray(pd.tags)?pd.tags:[];
  const base={name:a.name,regNo:a.reg_no,email:a.email,phone:a.phone,college:a.college,degree:a.degree,department:a.department,graduationYear:a.graduation_year,cgpa:a.cgpa};
  return `<div class="profile-full">
    ${pd.photo?`<img class="profile-photo" src="${esc(pd.photo)}" alt="Student photo">`:''}
    ${section('Student Overview',{...base,...d})}
    ${section('Point of Contact',{mentor:d.mentor,advisor:d.advisor,coord:d.coord})}
    ${tags.length?section('Student Tags',{tags:tags.join(', ')}):''}
    ${section('Student Details',{admit:d.admit,rank:d.rank,religion:d.religion,category:d.category,regOn:d.regOn,verOn:d.verOn,registered:d.registered,verBy:d.verBy})}
    ${section('Student Identity',{dayScholar:d.dayScholar,nation:d.nation,aadhaar:d.aadhaar,dl:d.dl,passNo:d.passNo,passIssue:d.passIssue,passExp:d.passExp})}
    ${section('Contact Details',{email:a.email,phone:a.phone,pemail:d.pemail,phone2:d.phone2,wa:d.wa,email2:d.email2,pwa:d.pwa,iemail:d.iemail,linkedin:d.linkedin||a.linkedin})}
    ${section('Address Details',{cCity:d.cCity,cDist:d.cDist,cState:d.cState,cCountry:d.cCountry,cPin:d.cPin,cAddr:d.cAddr,pCity:d.pCity,pDist:d.pDist,pState:d.pState,pCountry:d.pCountry,pPin:d.pPin,pAddr:d.pAddr,address:a.address})}
    ${section('Parent Information',{fName:d.fName,fEmail:d.fEmail,fPhone:d.fPhone,fJob:d.fJob,fCo:d.fCo,fOff:d.fOff,mName:d.mName,mEmail:d.mEmail,mPhone:d.mPhone,mJob:d.mJob,mCo:d.mCo,mOff:d.mOff})}
    ${section('Languages',langs)}
    ${section('Social Media',social)}
    ${links.length?`<section class="profile-section"><h3>Additional Links</h3><div class="profile-grid">${links.map((x,i)=>`<div class="profile-row"><span>${esc(x.name||`Link ${i+1}`)}</span><strong>${esc(x.url||'-')}</strong></div>`).join('')}</div></section>`:''}
    ${academics.map((x,i)=>section(i===0?'Academics':'Academic Record '+(i+1),x)).join('')}
    ${Object.entries(more).map(([k,v])=>Array.isArray(v)?collection(k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()),v):'').join('')}
    ${a.skills?.length?section('Skills',{skills:a.skills.join(', ')}):''}
    ${a.achievements?section('Achievements',{achievements:a.achievements}):''}
    ${a.summary?section('Profile Summary',{summary:a.summary}):''}
  </div>`;
}
function render(){
  $('applicantList').innerHTML=applicants.length?applicants.map(a=>`
    <article class="applicant-card">
      <div class="applicant-top">
        <div class="student-id"><div class="student-avatar">${esc(initials(a.name))}</div><div><h2>${esc(a.name)}</h2><p>${esc(a.reg_no||'-')} • ${esc(a.email||'-')} • Applied ${a.applied_at?new Date(a.applied_at).toLocaleDateString():'-'}</p></div></div>
        <span class="status ${statusClass(a.status)}">${esc(a.status)}</span>
      </div>
      <div class="student-grid">
        <div class="student-field"><small>Phone</small><strong>${esc(value(a.phone))}</strong></div>
        <div class="student-field"><small>College</small><strong>${esc(value(a.college))}</strong></div>
        <div class="student-field"><small>Degree</small><strong>${esc(value(a.degree))}</strong></div>
        <div class="student-field"><small>Department</small><strong>${esc(value(a.department))}</strong></div>
        <div class="student-field"><small>Graduation Year</small><strong>${esc(value(a.graduation_year))}</strong></div>
        <div class="student-field"><small>CGPA</small><strong>${esc(value(a.cgpa))}</strong></div>
      </div>
      ${fullProfile(a)}
      <div class="resume-box"><div><div class="resume-name">Uploaded Student Resume</div><div class="resume-meta">${a.resume_file_name?esc(a.resume_file_name):'No PDF resume uploaded'}</div></div><button class="action" data-resume="${a.application_id}" ${a.resume_file_name?'':'disabled'}>${a.resume_file_name?'View / Download Resume':'No Resume'}</button></div>
      <div class="actions"><button class="action select" data-status="Selected" data-id="${a.application_id}">✓ Select</button><button class="action waitlist" data-status="Waitlisted" data-id="${a.application_id}">⏳ Waitlist</button><button class="action reject" data-status="Rejected" data-id="${a.application_id}">✕ Reject</button>${a.status!=='Applied'?'<button class="action" data-status="Applied" data-id="'+a.application_id+'">Reset to Applied</button>':''}</div>
    </article>`).join(''):'<div class="empty">No students have applied to this job yet.</div>';
  document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>updateStatus(b.dataset.id,b.dataset.status));
  document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>downloadResume(b.dataset.resume));
}

async function updateStatus(id,status){
  try{
    await api('/company/applications/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});
    const a=applicants.find(x=>String(x.application_id)===String(id));
    if(a)a.status=status;
    render();
    msg(`Applicant marked ${status.toLowerCase()}.`,'ok');
  }catch(e){msg(e.message);}
}
async function downloadResume(id){
  try{
    const r=await fetch(API+'/company/applications/'+encodeURIComponent(id)+'/resume',{headers:{Authorization:'Bearer '+token}});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'Resume could not be loaded.');}
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    window.open(url,'_blank','noopener');
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){msg(e.message);}
}
async function load(){
  if(!jobId){$('applicantList').innerHTML='<div class="empty">No job was selected.</div>';return;}
  try{
    const company=await api('/company/me'); $('companyName').textContent=company.name;
    applicants=await api('/company/jobs/'+encodeURIComponent(jobId)+'/applications')||[];
    $('jobTitle').textContent=applicants[0]?.job_title||'Job Applicants';
    $('jobSub').textContent=`${applicants.length} applicant${applicants.length===1?'':'s'} for this job`;
    render();
  }catch(e){msg(e.message);$('applicantList').innerHTML='<div class="empty">Applicants could not be loaded.</div>';}
}
$('logout').onclick=()=>{localStorage.removeItem('stepupCompanyToken');localStorage.removeItem('stepupCompany');location.replace('company-login.html');};
load();
</script>
</body>
</html>
