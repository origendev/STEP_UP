<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepUp — Placement Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Core styles: order matters (tokens → layout → shared components) -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">

<!-- Per-page styles -->
<link rel="stylesheet" href="css/pages/home.css">
<link rel="stylesheet" href="css/pages/profile.css">
<link rel="stylesheet" href="css/pages/jobs.css">
<link rel="stylesheet" href="css/pages/demands.css">
<link rel="stylesheet" href="css/pages/skills.css">
<link rel="stylesheet" href="css/pages/progress.css">
<link rel="stylesheet" href="css/pages/settings.css">
</head>
<body>

<!-- ================= APP SHELL ================= -->
<div class="topbar">
  <div class="brand"><span class="brand-mark">S</span>StepUp</div>

  <div class="navlinks" id="navlinks">
    <button class="navlink active" data-tab="home">Home</button>
    <button class="navlink" data-tab="jobs">Jobs</button>
    <button class="navlink" data-tab="demands">Demands</button>
    <button class="navlink" data-tab="skills">Skills</button>
    <button class="navlink" data-tab="progress">Progress</button>
  </div>

  <div class="top-actions">
    <button class="icon-btn" aria-label="Search" title="Search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="icon-btn" aria-label="Notifications" title="Notifications">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <div class="profile-menu" id="profileMenu">
  <button class="avatar" id="avatarBtn" title="Account menu" aria-haspopup="true">V</button>
  <div class="profile-menu-panel" id="profileMenuPanel">
    <div class="profile-menu-header">
      <div class="profile-menu-avatar" id="menuAvatarInitial">V</div>
      <div>
        <div class="profile-menu-name" id="menuName">Vaishavi R</div>
        <div class="profile-menu-regno" id="menuRegNo">Reg No: —</div>
      </div>
    </div>
    <div class="profile-menu-divider"></div>
    <button class="profile-menu-item" data-goto="profile">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Profile
    </button>
    <button class="profile-menu-item" data-goto="settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
    <div class="profile-menu-divider"></div>
    <button class="profile-menu-item danger" id="menuLogoutBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log out
    </button>
  </div>
</div>
  </div>
</div>

<!-- Pages from /pages are injected here by js/core/router.js -->
<main id="app"></main>

<script type="module" src="js/app.js"></script>
</body>
</html>
