<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepUp — Placement Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Core styles: order matters (tokens → layout → shared components) -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">

<!-- Per-page styles -->
<link rel="stylesheet" href="css/pages/home.css">
<link rel="stylesheet" href="css/pages/profile.css">
<link rel="stylesheet" href="css/pages/jobs.css">
<link rel="stylesheet" href="css/pages/demands.css">
<link rel="stylesheet" href="css/pages/skills.css">
<link rel="stylesheet" href="css/pages/progress.css">
</head>
<body>

<!-- ================= APP SHELL ================= -->
<div class="topbar">
  <div class="brand"><img class="brand-logo" src="assets/logo.png" alt="StepUp"></div>

  <div class="navlinks" id="navlinks">
    <button class="navlink active" data-tab="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      <span class="navlabel" data-label="Home">Home</span>
    </button>
    <button class="navlink" data-tab="jobs">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
      <span class="navlabel" data-label="Jobs">Jobs</span>
    </button>
    <button class="navlink" data-tab="demands">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="12" width="4.5" height="8" rx="2.2"/><rect x="9.8" y="4" width="4.5" height="16" rx="2.2"/><rect x="15.6" y="8" width="4.5" height="12" rx="2.2"/></svg>
      <span class="navlabel" data-label="Demands">Demands</span>
    </button>
    <button class="navlink" data-tab="skills">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2.5 15 9 22 9.8 16.8 14.6 18.3 21.5 12 18 5.7 21.5 7.2 14.6 2 9.8 9 9"/></svg>
      <span class="navlabel" data-label="Skills">Skills</span>
    </button>
    <button class="navlink" data-tab="progress">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3"/><path d="M12 3v9h9"/></svg>
      <span class="navlabel" data-label="Progress">Progress</span>
    </button>
  </div>

  <div class="top-actions">
    <button class="icon-btn" aria-label="Search" title="Search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="icon-btn has-dot" aria-label="Notifications" title="Notifications">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <div class="avatar" id="avatarBtn" title="View profile">V</div>
  </div>
</div>

<!-- Pages from /pages are injected here by js/core/router.js -->
<main id="app"></main>

<script src="js/config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
