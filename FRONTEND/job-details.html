<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StepUp — Job Details</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><style>
.details-page{padding-top:32px}.back-link{display:inline-flex;color:var(--violet-700);font-weight:800;font-size:13px;margin-bottom:18px}.details-card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow-card)}.details-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:24px}.details-company{display:flex;gap:14px;align-items:center}.details-logo{width:60px;height:60px;border-radius:15px;background:var(--violet-100);color:var(--violet-700);display:flex;align-items:center;justify-content:center;font-weight:800}.details-company h1{margin:0;font-size:26px}.details-company p{margin:6px 0 0;color:var(--ink-soft);font-size:13px}.save-detail{border:1px solid var(--line);background:var(--white);border-radius:10px;padding:10px 14px;font-weight:800;color:var(--ink)}.save-detail.saved{background:var(--violet-100);color:var(--violet-700)}.details-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:24px;margin-top:24px}.details-main h2,.details-side h2{font-size:17px;margin:0 0 10px}.details-main p{color:var(--ink-soft);font-size:13.5px;line-height:1.7;white-space:pre-line}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--lilac-bg)}.fact small{display:block;color:var(--ink-soft);font-size:10.5px}.fact strong{display:block;margin-top:4px;font-size:12.5px}.roles{margin-top:25px}.role{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px}.role h3{margin:0;font-size:14px}.role p{margin:5px 0;color:var(--ink-soft);font-size:12px}.company-link{display:inline-block;margin-top:14px;color:var(--violet-700);font-size:12.5px;font-weight:800}.state{padding:65px 20px;text-align:center;color:var(--ink-soft)}@media(max-width:760px){.details-head{flex-direction:column}.details-grid{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}
</style><script src="js/config.js"></script></head><body><main class="details-page"><a class="back-link" href="index.html#/jobs">← Back to Jobs</a><div id="app" class="details-card"><div class="state">Loading listing…</div></div></main><script>
const API=window.STEPUP_API_BASE_URL||'http://localhost:3000/api';const id=new URLSearchParams(location.search).get('id');const $=id=>document.getElementById(id);const SAVED='stepupSavedListings';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function initials(n){return String(n||'S').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();}function saved(){try{return new Set(JSON.parse(localStorage.getItem(SAVED)||'[]').map(String))}catch{return new Set()}}function toggle(cid){const s=saved(),key=String(cid);s.has(key)?s.delete(key):s.add(key);localStorage.setItem(SAVED,JSON.stringify([...s]));render(current)}let current=null;
async function load(){if(!id){$('app').innerHTML='<div class="state">No job listing was selected.</div>';return}try{const r=await fetch(`${API}/jobs/${encodeURIComponent(id)}`);const d=await r.json();if(!r.ok)throw Error(d.error||'Listing not found');current=d.data;render(current)}catch(e){$('app').innerHTML=`<div class="state">${esc(e.message)}</div>`}}
function render(j){const s=saved(),isSaved=s.has(String(j.company_id));$('app').innerHTML=`<div class="details-head"><div class="details-company"><div class="details-logo">${esc(initials(j.company_name))}</div><div><h1>${esc(j.company_name)}</h1><p>${esc(j.industry||'IT')} • ${esc(j.company_location||j.location||'India')}</p></div></div><button class="save-detail ${isSaved?'saved':''}" id="save">${isSaved?'★ Saved':'☆ Save Company'}</button></div><div class="details-grid"><section class="details-main"><h2>${esc(j.title)}</h2><p>${esc(j.description)}</p><div class="facts"><div class="fact"><small>Job type</small><strong>${esc(j.job_type)}</strong></div><div class="fact"><small>Work mode</small><strong>${esc(j.work_mode||'Hybrid')}</strong></div><div class="fact"><small>Salary</small><strong>${esc(j.salary||j.stipend||'Not specified')}</strong></div><div class="fact"><small>Apply before</small><strong>${esc(String(j.apply_before||'').slice(0,10))}</strong></div><div class="fact"><small>Location</small><strong>${esc(j.location||j.company_location||'Not specified')}</strong></div><div class="fact"><small>Batch</small><strong>${esc(j.batch||'All eligible batches')}</strong></div></div><div class="roles"><h2>Recruitment status</h2><div class="role"><h3>${esc(j.status||'Eligible')}</h3><p>Posted on ${esc(j.created_at?new Date(j.created_at).toLocaleDateString(): 'StepUp')}</p></div></div></section><aside class="details-side"><h2>About the company</h2><p style="color:var(--ink-soft);font-size:13px;line-height:1.6">${esc(j.company_description||'Company information provided through the StepUp Company Portal.')}</p>${j.website?`<a class="company-link" href="${esc(j.website)}" target="_blank" rel="noopener">Visit company website →</a>`:''}</aside></div>`;$('save').onclick=()=>toggle(j.company_id)}load();
</script></body></html>
