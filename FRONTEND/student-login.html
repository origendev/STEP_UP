<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>StepUp — Student Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/student-auth.css">
</head>

<body class="student-auth-page">

<main class="student-auth-wrap">

  <div class="student-auth-brand">
    <div class="brand">
      <span class="brand-mark"></span>
      StepUp
    </div>
    <p>Student Placement Portal</p>
  </div>

  <section class="student-auth-card">

    <p class="eyebrow">STUDENT PORTAL</p>

    <h1>Welcome back</h1>

    <p class="description">
      Sign in using the student account created for you by the placement administrator.
    </p>

    <div id="message" class="student-auth-message"></div>

    <form id="loginForm">

      <label>
        Registration Number
        <input
          id="regNo"
          type="text"
          autocomplete="username"
          placeholder="Enter your registration number"
          required
        >
      </label>

      <label>
        Password
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        >
      </label>

      <a class="student-auth-link" href="student-forgot-password.html">
        Forgot my password?
      </a>

      <button
        id="loginButton"
        class="student-auth-button"
        type="submit"
      >
        Sign In
      </button>

    </form>

    <div class="student-auth-divider"></div>

  </section>

</main>

<script src="js/config.js"></script>
<script type="module">

import { api, setSession } from './js/core/api.js';

const form = document.getElementById('loginForm');
const msg = document.getElementById('message');
const btn = document.getElementById('loginButton');
const regNo = document.getElementById('regNo');
const password = document.getElementById('password');

function show(text, type = 'error') {
  msg.textContent = text;
  msg.className = `student-auth-message show ${type}`;
}

form.addEventListener('submit', async e => {

  e.preventDefault();

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {

    const r = await api('/student/login', {
      method: 'POST',

      body: JSON.stringify({
        regNo: regNo.value.trim(),
        password: password.value
      })
    });

    setSession(r.data);

    if (
      r.data.student.must_change_password ||
      !r.data.student.profile_completed
    ) {

      location.href = 'student-profile.html';

    } else {

      location.href = 'index.html#/home';

    }

  } catch (err) {

    show(err.message);

  } finally {

    btn.disabled = false;
    btn.textContent = 'Sign In';

  }

});

</script>

</body>
</html>
