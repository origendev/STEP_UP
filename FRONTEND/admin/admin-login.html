<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StepUp admin login">
  <title>StepUp — Admin Login</title>

  <style>
    :root {
      --bg: #090d1f;
      --card: #111936;
      --line: #29365f;
      --text: #f7f8ff;
      --muted: #9ba6c6;
      --input: #080d1f;
      --violet: #7257ff;
      --blue: #4c70ff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(114, 87, 255, 0.14), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    .login-wrap { width: min(430px, 100%); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 22px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(135deg, #694dff, #8c70ff);
      font-size: 16px;
    }

    .brand span { color: #8d73ff; }

    .card {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #8d73ff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
    }

    .description {
      margin: 9px 0 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    label {
      display: block;
      margin-bottom: 14px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    input {
      width: 100%;
      margin-top: 7px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--input);
      color: var(--text);
      outline: 0;
      font: inherit;
      font-size: 13px;
    }

    input:focus {
      border-color: var(--violet);
      box-shadow: 0 0 0 3px rgba(114, 87, 255, 0.14);
    }

    .primary,
    .back {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .primary {
      margin-top: 5px;
      border: 0;
      background: linear-gradient(135deg, var(--blue), var(--violet));
      color: #fff;
      cursor: pointer;
    }

    .primary:hover { filter: brightness(1.08); }

    .notice {
      margin: 16px 0 0;
      padding: 10px 12px;
      border: 1px solid #303d68;
      border-radius: 9px;
      color: var(--muted);
      background: rgba(8, 13, 31, 0.55);
      font-size: 11.5px;
      line-height: 1.5;
      text-align: center;
    }

    .back {
      margin-top: 12px;
      color: #91a0ff;
    }

    .back:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <main class="login-wrap">
    <div class="brand" aria-label="StepUp">
      <span class="brand-mark">S</span>
      Step<span>Up</span>
    </div>

    <section class="card">
      <p class="eyebrow">ADMIN PORTAL</p>
      <h1>Admin Sign In</h1>
      <p class="description">Administrative authentication will be connected later.</p>

      <form id="adminDemoForm">
        <label for="adminId">
          Admin ID
          <input id="adminId" name="adminId" type="text" placeholder="Enter admin ID" autocomplete="username">
        </label>

        <label for="adminPassword">
          Password
          <input id="adminPassword" name="adminPassword" type="password" placeholder="Enter password" autocomplete="current-password">
        </label>

        <button class="primary" type="submit">Sign In</button>
      </form>

      <p class="notice">This is a dummy admin page for now. No credentials are processed or stored.</p>
      <a class="back" href="../portal-access.html">&larr; Back to portal selection</a>
    </section>
  </main>

  <script>
    document.getElementById('adminDemoForm').addEventListener('submit', function (event) {
      event.preventDefault();
      window.alert('Admin login is a demo for now. Admin authentication will be added later.');
    });
  </script>
</body>
</html>
