<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StepUp — Change Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/student-auth.css"></head>
<body class="student-auth-page"><main class="student-auth-wrap"><div class="student-auth-brand">
    <img class="student-auth-logo" src="assets/logo.png" alt="StepUp">
  </div>
<section class="student-auth-card"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change password</h1><p class="description">Update the password for your StepUp student account.</p><div id="message" class="student-auth-message"></div>
<form id="form"><label>Current password<input id="currentPassword" type="password" required></label><label>New password<input id="newPassword" type="password" minlength="8" required></label><label>Confirm new password<input id="confirmPassword" type="password" minlength="8" required></label><button class="student-auth-button" type="submit">Change Password</button></form>
<div class="student-auth-divider"></div><a class="student-auth-link" style="text-align:center;margin:0" href="index.html#/home">← Back to dashboard</a></section></main>
<script type="module">import {api,getToken} from './js/core/api.js';if(!getToken())location.href='student-login.html';const form=document.getElementById('form'),msg=document.getElementById('message');function show(t,c='error'){msg.textContent=t;msg.className=`student-auth-message show ${c}`;}form.addEventListener('submit',async e=>{e.preventDefault();if(newPassword.value!==confirmPassword.value)return show('The new passwords do not match.');try{const r=await api('/student/change-password',{method:'POST',body:JSON.stringify({currentPassword:currentPassword.value,newPassword:newPassword.value})});show(r.data.message,'success');form.reset();}catch(e){show(e.message);}});</script></body></html>
