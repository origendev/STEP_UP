<!-- ============================================================
     progress.html — Placement progress page
     Funnel and timeline are rendered by js/pages/progress.js
============================================================ -->
<div class="view" id="view-progress">

  <div class="section-heading" style="margin-top:36px;">
    <div>
      <h2>Progress</h2>
      <p>Your placement journey, end to end</p>
    </div>
  </div>

  <div class="funnel" id="funnel"></div>

  <section class="block">
    <div class="grid2">

      <div class="card">
        <div class="card-head">
          <div class="card-title">
            <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
            Journey Timeline
          </div>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">
            <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg></span>
            Overall Readiness
          </div>
        </div>
        <div class="donut-row" style="justify-content:center;">
          <svg width="130" height="130" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--violet-100)" stroke-width="14"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="url(#g2)" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="314" stroke-dashoffset="126" transform="rotate(-90 60 60)"/>
            <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--violet-700)"/><stop offset="100%" stop-color="var(--violet-500)"/>
            </linearGradient></defs>
            <text x="60" y="56" text-anchor="middle" font-family="Sora" font-size="22" font-weight="800" fill="var(--ink)">60%</text>
            <text x="60" y="74" text-anchor="middle" font-family="Inter" font-size="10.5" fill="var(--ink-soft)">Placement ready</text>
          </svg>
        </div>
        <div class="divider" style="margin-top:16px;"></div>
        <div id="readinessList"></div>
      </div>

    </div>
  </section>

</div>
