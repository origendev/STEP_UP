============================================================ -->
<div class="view" id="view-progress">

  <div class="section-heading" style="margin-top:36px;">
    <div>
      <h2>Progress</h2>
      <p>Your placement journey, end to end</p>
    </div>
  </div>

  
  <div class="progress-status" id="progressStatus"></div>
  <div class="progress-learning-grid" id="learningProgress"></div>
  <section class="block">
  <div class="progress-insights-grid">

    <div class="card insight-card" id="codingActivity"></div>

    <div class="card insight-card" id="githubStreak"></div>

    <div class="card insight-card" id="goalsMilestones"></div>

  </div>
</section>


  <section class="block">
    <div class="grid2 timeline-layout"></div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">
            <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
            Journey Timeline
          </div>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>

      

    </div>
  </section>

</div>
