<!-- ============================================================
     skills.html — Skills page: free courses with free certificates
     Markup only. Cards are rendered by js/pages/skills.js from
     js/data/skills.data.js
============================================================ -->
<div class="view" id="view-skills">

  <div class="section-heading" style="margin-top:36px;">
    <div>
      <h2>Skills</h2>
      <p>Free courses with free certificates from trusted companies and institutions</p>
    </div>
    <span class="badge badge-violet" id="skCount"></span>
  </div>

  <div class="sk-tabs" id="skTabs" role="tablist" aria-label="Department"></div>

  <div class="sk-years" id="skYears" role="group" aria-label="Study year"></div>
  <p class="sk-blurb" id="skBlurb"></p>

  <p class="sk-note" id="skNote" hidden></p>

  <div id="skBody"></div>

  <p class="sk-foot">
    These courses are run by the companies and institutions themselves, so you may need to create a free account on their site.
    Certificate rules can change — check the course page before you start.
  </p>

</div>
