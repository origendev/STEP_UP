<div class="view" id="view-profile">
  <div class="profile-head">
    <div class="profile-card">
      <div class="profile-avatar" id="profileAvatar"></div>
      <div class="profile-name" id="profileName"></div>
      <div class="profile-role" id="profileRole"></div>
      <div class="profile-tags">
        <span class="profile-tag" id="profileRegNo"></span>
        <span class="profile-tag" id="profileCgpa"></span>
      </div>
      <div class="completeness-wrap">
        <div class="completeness-row"><span>Profile completeness</span><span id="pctLabel"></span></div>
        <div class="progress-track"><div class="progress-fill" id="pctFill" style="width:0%"></div></div>
      </div>
    </div>

    <div class="card" style="flex:2;min-width:320px;">
      <div class="card-head">
        <div class="card-title"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>Personal Details</div>
        <button class="btn-tiny" id="editToggleBtn">Edit</button>
      </div>
      <div class="field-grid" id="personalFieldsGrid"></div>
      <div class="edit-actions" id="editActions">
        <button class="btn-solid" id="saveBtn">Save Changes</button>
        <button class="btn-cancel" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <section class="block">
    <div class="grid2">
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/></svg></span>Academic Details</div>
        </div>
        <div class="field-grid" id="academicFieldsGrid"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 7l3-3a5 5 0 0 0-7-7"/><path d="M14 11a5 5 0 0 0-7-7l-3 3a5 5 0 0 0 7 7"/></svg></span>Social &amp; Links</div>
        </div>
        <div id="socialList"></div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>Resume &amp; Documents</div>
      </div>
      <div id="documentsList"></div>
      <input type="file" id="docFileInput" hidden>
    </div>
  </section>
</div>
