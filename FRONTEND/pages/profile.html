<div class="view pf" id="view-profile">
  <header class="card pf-head" id="pfHeader"></header>
  <nav class="pf-tabs" id="pfTabs" role="tablist" aria-label="Profile sections"></nav>
  <div id="pfPanel"></div>
  <input type="file" id="pfPhotoIn" accept="image/*" hidden>
  <input type="file" id="pfDocIn" hidden>
  <input type="file" id="pfProofIn" accept="image/*" hidden>
  <input type="file" id="pfResumeIn" accept=".pdf,.doc,.docx,.rtf,.txt" hidden>
</div>
